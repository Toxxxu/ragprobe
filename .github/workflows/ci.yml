name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start mock RAG server
        run: npm run example:server &
      - name: Wait for server
        run: npx --yes wait-on http://localhost:4010/health
      - name: Evaluate (fails the build if thresholds are not met)
        run: npm run example:eval -- --min-recall 0.6 --min-mrr 0.5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ragprobe-report
          path: reports/
