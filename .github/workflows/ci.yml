name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          standalone: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          standalone: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start mock RAG server
        run: pnpm run example:server &
      - name: Wait for server
        run: pnpm dlx wait-on http://localhost:4010/health
      - name: Evaluate (fails the build if thresholds are not met)
        run: pnpm run example:eval -- --min-recall 0.6 --min-mrr 0.5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ragprobe-report
          path: reports/
